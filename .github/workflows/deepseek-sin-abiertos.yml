name: deepseek-sin-abiertos

# Check requerido por la protección de main. El sticky lo publica GITHUB_TOKEN y
# sus eventos no lanzan workflows, así que al abrir o actualizar un PR el job se
# queda leyendo hasta que DeepSeek publica para esa cabeza (como mucho 40 min) y
# entonces marca. Un push nuevo cancela la espera anterior. El calendario y el
# disparo manual reevalúan todos los PR abiertos, como red de seguridad.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [ai-review-publish]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deepseek-sin-abiertos-${{ github.event.pull_request.number || 'todos' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Evaluar y publicar el check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_EVENTO: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          publicar() { # numero esperar
            local numero=$1 esperar=$2 sha nota rc limite
            limite=$(( $(date +%s) + 2400 ))
            while :; do
              sha="$(gh api "repos/${repo}/pulls/${numero}" --jq .head.sha)"
              set +e
              nota="$(python3 .github/scripts/compuerta.py "$repo" "$numero")"
              rc=$?
              set -e
              if [ "$rc" != 2 ] || [ "$esperar" != si ] || [ "$(date +%s)" -ge "$limite" ]; then
                break
              fi
              sleep 20
            done
            case "$rc" in
              0) args=(-f status=completed -f conclusion=success) ;;
              1) args=(-f status=completed -f conclusion=failure) ;;
              *) args=(-f status=in_progress) ;;
            esac
            # Se actualizan todas las marcas de este commit: una pendiente vieja junto a
            # una nueva en verde basta para que la protección de main bloquee el merge.
            # Una pendiente nueva no reabre una marca ya cerrada.
            existentes="$(gh api "repos/${repo}/commits/${sha}/check-runs?check_name=deepseek-sin-abiertos&per_page=100" \
              --jq '.check_runs[] | select(.app.slug == "github-actions") | "\(.id) \(.status)"')"
            if [ -z "$existentes" ]; then
              gh api -X POST "repos/${repo}/check-runs" -f name=deepseek-sin-abiertos -f head_sha="$sha" \
                "${args[@]}" -f "output[title]=DeepSeek sin abiertos" -f "output[summary]=${nota}" >/dev/null
            else
              while read -r id estado; do
                if [ "$rc" = 0 ] || [ "$rc" = 1 ] || [ "$estado" != completed ]; then
                  gh api -X PATCH "repos/${repo}/check-runs/${id}" "${args[@]}" \
                    -f "output[title]=DeepSeek sin abiertos" -f "output[summary]=${nota}" >/dev/null
                fi
              done <<<"$existentes"
            fi
            echo "#${numero} ${sha:0:7} rc=${rc} ${nota}"
          }

          if [ -n "$PR_EVENTO" ]; then
            publicar "$PR_EVENTO" si
          else
            for numero in $(gh api "repos/${repo}/pulls?state=open&per_page=100" --jq '.[].number'); do
              publicar "$numero" no
            done
          fi
