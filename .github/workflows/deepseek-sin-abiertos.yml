name: deepseek-sin-abiertos

# El check requerido "deepseek-sin-abiertos" es el resultado de este job, como
# "pruebas": GitHub no siempre cuenta las marcas creadas aparte por la API. Al
# abrir o actualizar un PR, el job espera la revisión de DeepSeek de esa cabeza
# (máx. 40 min) y termina en verde sin hallazgos medios o mayores abiertos, o en
# rojo. Un push nuevo cancela la espera anterior.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  deepseek-sin-abiertos:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deepseek-sin-abiertos-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Esperar la revisión de DeepSeek de esta cabeza
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          limite=$(( $(date +%s) + 2400 ))
          while :; do
            nota="$(python3 .github/scripts/compuerta.py "$GITHUB_REPOSITORY" "$PR")"
            rc=$?
            echo "$nota"
            [ "$rc" = 0 ] && exit 0
            [ "$rc" = 1 ] && exit 1
            [ "$(date +%s)" -ge "$limite" ] && { echo "DeepSeek no publicó en 40 min; la vuelta de 15 min lo vuelve a correr"; exit 1; }
            sleep 20
          done

  # Si DeepSeek publicó después de que el job de un PR terminó en rojo, lo vuelve a
  # correr. También borra las ramas de PR ya mergeados: GitHub no las borra cuando
  # el merge lo hace el auto-merge de GITHUB_TOKEN. Solo una rama intacta (su punta
  # es la que se mergeó) y que ningún PR abierto usa.
  mantenimiento:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Volver a correr la compuerta donde DeepSeek ya aprobó
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          repo="$GITHUB_REPOSITORY"
          for numero in $(gh api --paginate "repos/${repo}/pulls?state=open&per_page=100" --jq '.[].number'); do
            sha="$(gh api "repos/${repo}/pulls/${numero}" --jq .head.sha)"
            python3 .github/scripts/compuerta.py "$repo" "$numero" >/dev/null || continue
            run="$(gh api "repos/${repo}/actions/workflows/deepseek-sin-abiertos.yml/runs?event=pull_request&head_sha=${sha}&per_page=1" \
              --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion != "success") | .id')"
            if [ -n "$run" ]; then
              gh api -X POST "repos/${repo}/actions/runs/${run}/rerun-failed-jobs" >/dev/null && echo "#${numero}: compuerta relanzada"
            fi
          done
      - name: Borrar ramas de PR mergeados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          default="$(gh api "repos/${repo}" --jq .default_branch)"
          declare -A punta
          while read -r nombre sha; do punta["$nombre"]="$sha"; done < <(
            gh api --paginate "repos/${repo}/branches?per_page=100" --jq '.[] | "\(.name) \(.commit.sha)"')
          abiertas="$(gh api --paginate "repos/${repo}/pulls?state=open&per_page=100" --jq '.[].head.ref')"
          gh api --paginate "repos/${repo}/pulls?state=closed&per_page=100" \
            --jq ".[] | select(.merged_at != null and .head.repo.full_name == \"${repo}\") | \"\(.head.ref) \(.head.sha)\"" |
          while read -r rama sha; do
            [ "$rama" = "$default" ] && continue
            [ "${punta[$rama]:-}" = "$sha" ] || continue
            if grep -qxF "$rama" <<<"$abiertas"; then echo "se queda (la usa un PR abierto): ${rama}"; continue; fi
            ruta="$(jq -rn --arg r "$rama" '$r | split("/") | map(@uri) | join("/")')"
            if gh api -X DELETE "repos/${repo}/git/refs/heads/${ruta}" >/dev/null; then
              echo "borrada: ${rama}"
            else
              echo "no se pudo borrar: ${rama}"
            fi
          done
